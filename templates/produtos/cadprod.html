<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto - Reboco</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-6">

    <div class="max-w-lg w-full bg-white rounded-2xl shadow-2xl overflow-hidden border border-pink-100">
        <div class="bg-pink-600 p-6">
            <h1 class="text-2xl font-bold text-white text-center">Cadastro de Produtos</h1>
            <p class="text-pink-100 text-center text-sm">Adicione novos itens ao seu catálogo de beleza</p>
        </div>

        <form action="{{ url_for('postprod') }}" method="post" enctype="multipart/form-data" class="p-8 space-y-6">
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Imagem do Produto</label>
                <div class="flex items-center justify-center w-full">
                    <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-pink-200 rounded-lg cursor-pointer bg-pink-50 hover:bg-pink-100 transition">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <svg class="w-8 h-8 mb-3 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            <p class="text-xs text-pink-600 font-medium">Clique para enviar a foto</p>
                        </div>
                        <input type="file" name="imagem" class="hidden"  />
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Nome do Produto</label>
                <input type="text" name="nome" placeholder="Ex: Batom Matte Intenso" 
                    class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-pink-500 focus:border-transparent outline-none transition" required>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Preço (R$)</label>
                <input type="number" step="0.01" name="preco" placeholder="0,00" 
                    class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-pink-500 focus:border-transparent outline-none transition" required>
            </div>

            <div class="pt-4 space-y-3">
                <button type="submit" 
                    class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-lg shadow-lg shadow-pink-200 transition duration-300 transform active:scale-95">
                    Confirmar Cadastro
                </button>
                
                <a href="{{ url_for('portal') }}" class="block text-center text-sm text-gray-400 hover:text-pink-600 font-medium transition">
                    Voltar ao Início
                </a>
            </div>

        </form>
    </div>

</body>
</html>
