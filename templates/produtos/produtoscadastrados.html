<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos Cadastrados - Reboco</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">

    <header class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
        <div>
            <h2 class="text-3xl font-bold text-gray-800 uppercase tracking-tight">
                Produtos <span class="text-pink-600">Cadastrados</span>
            </h2>
            <p class="text-gray-500 text-sm">Gerencie o estoque da sua loja</p>
        </div>

        <nav class="flex gap-3">
            <a href="{{ url_for('portal') }}" class="px-5 py-2 bg-white border border-gray-200 text-gray-600 rounded-lg hover:bg-gray-100 transition shadow-sm font-medium">
                Início
            </a>
            <a href="{{ url_for('cadprod') }}" class="px-5 py-2 bg-pink-600 text-white rounded-lg hover:bg-pink-700 transition shadow-lg shadow-pink-100 font-medium">
                + Novo Produto
            </a>
        </nav>
    </header>

    <hr class="max-w-6xl mx-auto border-gray-200 mb-10">

    <main class="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        
        {% for prod in produtos %}
        <div class="bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden hover:shadow-xl transition duration-300 transform hover:-translate-y-1">
            
           

            <div class="h-48 bg-pink-50 flex items-center justify-center border-b border-gray-50">
                <span class="text-pink-200 font-bold text-4xl">
                    <img src="{{ url_for('testeimagem',id=prod['id']) }}" alt="" height="200px" width="200px">
                </span>
            </div>

            <div class="p-5">
                <div class="flex justify-between items-start mb-2">
                    <h3 class="font-bold text-gray-800 text-lg leading-tight">{{ prod['nome'] }}</h3>
                    <span class="bg-pink-100 text-pink-700 text-xs font-bold px-2 py-1 rounded uppercase">Estoque</span>
                </div>
                
                <p class="text-2xl font-bold text-pink-600 mb-6">
                    R$ {{ "{:,.2f}".format(prod['preco']) }}
                </p>

                <div class="grid grid-cols-2 gap-3">
                    <a href=" {{ url_for('alterar',id=prod['id'])}}" class="text-center bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 rounded-lg transition text-sm">
                        Alterar
                    </a>
                    <a href=" {{ url_for('excluirprod',id=prod['id'])  }}  " class="text-center bg-red-50 hover:bg-red-100 text-red-600 font-semibold py-2 rounded-lg transition text-sm">
                        Excluir
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}

    </main>

    {% if not produtos %}
    <div class="text-center py-20">
        <p class="text-gray-400 italic">Nenhum produto encontrado no catálogo.</p>
    </div>
    {% endif %}

</body>
</html>
